services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-KitchenCheck}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/kitchencheck.db}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      OPERATION_TIMEZONE: "${OPERATION_TIMEZONE:-America/Sao_Paulo}"
      AUTOMATION_INTERVAL_MINUTES: "${AUTOMATION_INTERVAL_MINUTES:-1}"
    volumes:
      - kitchencheck_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  automation:
    build: .
    command: ["python", "-m", "app.automation"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-KitchenCheck}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/kitchencheck.db}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OPERATION_TIMEZONE: "${OPERATION_TIMEZONE:-America/Sao_Paulo}"
      AUTOMATION_INTERVAL_MINUTES: "${AUTOMATION_INTERVAL_MINUTES:-1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: "${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-10}"
      TELEGRAM_RETRY_ATTEMPTS: "${TELEGRAM_RETRY_ATTEMPTS:-3}"
      TELEGRAM_RETRY_DELAY_SECONDS: "${TELEGRAM_RETRY_DELAY_SECONDS:-1}"
      TELEGRAM_DAILY_SUMMARY_TIME: "${TELEGRAM_DAILY_SUMMARY_TIME:-23:00}"
    volumes:
      - kitchencheck_data:/app/data

volumes:
  kitchencheck_data:
